<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Claude in Moroccan Darija</title>

<style>
:root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #4b5563;
    --border-color: #e2e8f0;
    --accent: #059669;
    --accent-hover: #047857;
    --radius: 16px;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background-color: var(--bg-color);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 16px;
    max-width: 420px;
    width: 100%;
    text-align: center;
}

h1 {
    font-size: 2rem;
    font-weight: 800;
}

.highlight {
    color: var(--accent);
}

.subtitle {
    color: var(--text-muted);
    margin: 20px 0;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    background: var(--accent);
    color: white;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
}

.message {
    margin-top: 15px;
    font-weight: 500;
}
</style>
</head>

<body>

<div class="card">
    <h1>Learn Claude in <span class="highlight">Moroccan Darija</span> 🇲🇦</h1>

    <p class="subtitle">
        The ultimate guide for your <strong>studies, work, and business</strong>.
        Build websites, apps, and presentations easily.
    </p>

    <p><strong>🚀 testing the idea — join if you are interested:</strong></p>

    <form id="form">
        <input type="email" id="email" placeholder="Enter your email" required>
        <button type="submit">Get early access</button>
    </form>

    <p id="msg" class="message"></p>
</div>

<script>
const BIN_ID = "69cfc31b36566621a87715b9";
const API_KEY = "$2a$10$xgNw51cRCqhEr5dCGjsRHOK3eTHJZUlhDxmmzjoAbv/9RDB20DDb6";

const form = document.getElementById("form");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    msg.innerText = "Saving...";

    try {
        // GET old data
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { "X-Master-Key": API_KEY }
        });

        const data = await res.json();

        let emails = data.record.emails || [];

        emails.push({
            email: email,
            date: new Date().toISOString()
        });

        // UPDATE
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "X-Master-Key": API_KEY
            },
            body: JSON.stringify({ emails })
        });

        msg.innerText = "✅ You're on the list!";
        form.reset();

    } catch (err) {
        msg.innerText = "❌ Error saving email";
    }
});
</script>

</body>
</html>
