<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Claude in Moroccan Darija</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #4b5563;
            --border-color: #e2e8f0;
            --accent: #059669;
            --accent-hover: #047857;
            --radius: 16px;
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 3rem 2.5rem;
            border-radius: var(--radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .highlight {
            color: var(--accent);
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .test-text {
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: #0f172a;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
        }

        input[type="email"] {
            width: 100%;
            padding: 1rem 1.25rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #f9fafb;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        input[type="email"]::placeholder {
            color: #9ca3af;
        }

        input[type="email"]:focus {
            background-color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
        }

        button {
            width: 100%;
            padding: 1rem 1.25rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(5, 150, 105, 0.25);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .trust-text {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
            font-weight: 500;
        }

        .form-message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-message.success {
            display: block;
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .form-message.error {
            display: block;
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Learn Claude in <span class="highlight">Moroccan Darija</span> 🇲🇦</h1>

        <p class="subtitle">
            The ultimate guide for your <strong>studies, work, and business</strong>.
            Build websites, apps, and presentations easily.
        </p>

        <p class="test-text">
            🚀 testing the idea — join if you are interested:
        </p>

        <form id="waitlist-form">
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
            <button type="submit" id="submit-btn">Get early access</button>
        </form>

        <div id="form-message" class="form-message"></div>
        <p class="trust-text">Simple, practical, and made for real use.</p>
    </div>

    <script>
        const form = document.getElementById('waitlist-form');
        const emailInput = document.getElementById('email');
        const messageEl = document.getElementById('form-message');
        const button = document.getElementById('submit-btn');

        function getStoredEmails() {
            return JSON.parse(localStorage.getItem('waitlistEmails')) || [];
        }

        function saveEmail(email) {
            const storedEmails = getStoredEmails();

            const alreadyExists = storedEmails.some(
                item => item.email.toLowerCase() === email.toLowerCase()
            );

            if (alreadyExists) {
                return { success: false, message: "This email is already registered." };
            }

            storedEmails.push({
                email: email,
                createdAt: new Date().toISOString()
            });

            localStorage.setItem('waitlistEmails', JSON.stringify(storedEmails));
            return { success: true, message: "Success! You're on the list." };
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const originalBtnText = button.textContent;
            button.textContent = 'Saving...';
            button.disabled = true;
            messageEl.className = 'form-message';

            try {
                const email = emailInput.value.trim();

                if (!email) {
                    throw new Error("Please enter a valid email.");
                }

                const result = saveEmail(email);

                if (result.success) {
                    messageEl.textContent = result.message;
                    messageEl.className = 'form-message success';
                    form.reset();
                } else {
                    messageEl.textContent = result.message;
                    messageEl.className = 'form-message error';
                }
            } catch (error) {
                messageEl.textContent = error.message || "Oops! Something went wrong.";
                messageEl.className = 'form-message error';
            } finally {
                button.textContent = originalBtnText;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
