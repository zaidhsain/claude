<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn Claude in Moroccan Darija</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #dbe4ee;
      --accent: #059669;
      --accent-hover: #047857;
      --radius: 18px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(5, 150, 105, 0.12), transparent 32%),
        linear-gradient(180deg, #f3f9f5 0%, #f8fafc 45%, #eef6f1 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 470px;
      padding: 40px 32px;
      border-radius: var(--radius);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      text-align: center;
      border: 1px solid #e5e7eb;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 16px;
      line-height: 1.15;
    }

    .highlight {
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .testing-note {
      font-weight: bold;
      margin-bottom: 24px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="email"] {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .hidden {
      display: none;
    }

    .trust-text {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Learn Claude in <span class="highlight">Moroccan Darija</span> 🇲🇦</h1>

    <p class="subtitle">
      The ultimate guide for your <strong>studies, work, and business</strong>.
      Build websites, apps, and presentations easily.
    </p>

    <p class="testing-note">Testing this idea. Join if you're interested.</p>

    <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="a53c2ac5-f411-4b1d-a4c3-42f09c59e85e" />
      <input type="hidden" name="subject" value="New waitlist signup" />
      <input type="hidden" name="from_name" value="Claude Darija Landing Page" />
      <input type="hidden" name="redirect" value="https://web3forms.com/success" />

      <input type="checkbox" name="botcheck" class="hidden" />

      <input type="email" name="email" placeholder="Enter your email" required />

      <button type="submit">Get early access</button>
    </form>

    <p class="trust-text">Simple, practical, and made for real use.</p>
  </div>
</body>
</html>
